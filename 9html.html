<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML canvas and SVG graphic</title>
    
</head>
<body>
    <style>
    body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            width: 420px;
        }

        .card h2 {
            margin-top: 0;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        canvas {
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background-color: #fafafa;
        }

        svg {
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background-color: #fafafa;
        }
        </style>
    <div class="container">
        <!-- Section 1: HTML5 Canvas -->
        <div class="card">
            <h2>HTML5 Canvas Drawings</h2>
            <canvas id="myCanvas" width="380" height="280"></canvas>
        </div>
        <div class="card">
            <h2>SVG College Logo</h2>
            <svg width="380" height="280" viewBox="0 0 380 280">
                <!-- Background Shield Frame -->
                <polygon points="190,20 290,60 290,170 190,230 90,170 90,60" 
                fill="#1e3a8a" stroke="#0284c7" stroke-width="4" />
                <!-- Inner Shield Accent -->
                <polygon points="190,32 278,67 278,163 190,218 102,163 102,67" 
                         fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" />

                
                <!-- Graduation Cap Icon -->
                <!-- Cap Top (Diamond) -->
                <polygon points="190,75 240,95 190,115 140,95" fill="#f59e0b" />
                <!-- Cap Base -->
                <path d="M160,103 L160,122 Q190,137 220,122 L220,103 Q190,113 160,103 Z" fill="#d97706" />
                <!-- Cap Tassel -->
                <line x1="230" y1="99" x2="245" y2="125" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
                <circle cx="245" cy="127" r="4" fill="#f59e0b" />

                <!-- Open Book Icon -->
                <path d="M140,150 Q165,142 190,152 Q215,142 240,150 L240,180 Q215,172 190,182 Q165,172 140,180 Z" 
                      fill="#ffffff" />
                <line x1="190" y1="152" x2="190" y2="182" stroke="#1e3a8a" stroke-width="2" />

                <!-- Banner Ribbon for Text -->
                <path d="M100,225 Q190,245 280,225 L270,250 Q190,270 110,250 Z" fill="#0284c7" />

                <!-- College Name Text -->
                <text x="190" y="244" font-family="Arial, sans-serif" font-size="13" font-weight="bold" 
                      fill="#ffffff" text-anchor="middle">MARWADI UNIVERSITY</text>
            </svg>
        </div>
    </div>

    <!-- JavaScript to Render Canvas Elements -->
    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        // 1. Draw a Line
        ctx.beginPath();
        ctx.moveTo(30, 40);
        ctx.lineTo(350, 40);
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 2. Draw a Rectangle
        ctx.fillStyle = '#2563eb';
        ctx.fillRect(40, 70, 130, 80);
        ctx.strokeStyle = '#1e40af';
        ctx.lineWidth = 2;
        ctx.strokeRect(40, 70, 130, 80);

        // 3. Draw a Circle
        ctx.beginPath();
        ctx.arc(280, 110, 40, 0, 2 * Math.PI);
        ctx.fillStyle = '#10b981';
        ctx.fill();
        ctx.strokeStyle = '#047857';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 4. Draw Canvas Text
        ctx.font = 'bold 20px Arial';
        ctx.fillStyle = '#0f172a';
        ctx.textAlign = 'center';
        ctx.fillText('HTML5 Canvas Shapes', 190, 200);

        // Subtitle Text
        ctx.font = '14px Arial';
        ctx.fillStyle = '#64748b';
        ctx.fillText('(Line, Rectangle, Circle, Text)', 190, 230);
    </script>
</body>
</html>
